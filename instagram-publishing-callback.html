<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Return to your publishing connection — Content Factory 02</title>
  <style>
    :root { color-scheme: dark; font: 17px/1.6 system-ui, sans-serif; background: #101723; color: #e9edf4; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(36rem, calc(100% - 3rem)); padding: 3rem 0; }
    .brand { color: #a8c8ff; letter-spacing: .08em; font-size: .85rem; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin: 1rem 0; }
    p { color: #bdc9db; }
    button { font: inherit; border: 0; border-radius: .5rem; padding: .8rem 1.1rem; background: #b2d0ff; color: #0c1728; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .note { margin-top: 2rem; font-size: .9rem; }
  </style>
  <script src="instagram-publishing-callback.js" defer referrerpolicy="no-referrer"></script>
</head>
<body>
  <main>
    <div class="brand">Content Factory 02</div>
    <h1>Return to your publishing connection.</h1>
    <p id="connection-status" role="status">Checking the Instagram connection return…</p>
    <button id="return-button" type="button" hidden>Return to the local app</button>
    <noscript><p>JavaScript is required to return this connection to your local app. Close this page and restart the connection in a browser with JavaScript enabled. Do not copy a login code into chat.</p></noscript>
    <p class="note">This page does not publish content. Your local app checks the connection before it can be used.</p>
  </main>
</body>
</html>
